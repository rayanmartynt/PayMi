<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Verification Under Review</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #44b75e 0%, #3762ae 100%);">
  <div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 50px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #44b75e 0%, #3762ae 100%); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
        <span style="color: white; font-size: 24px;">⏳</span>
      </div>
      <h2 style="color: #333; margin-top: 0; font-size: 28px; font-weight: 700;">KYC Verification Under Review</h2>
    </div>
    <p style="color: #555; font-size: 16px; line-height: 1.6;">Hi {{name}},</p>
    <p style="color: #555; font-size: 16px; line-height: 1.6;">Your KYC verification is currently under review.</p>
    <p style="color: #555; font-size: 16px; line-height: 1.6;">We'll notify you once the review is complete.</p>
    <div style="background: #b4c7e9; padding: 20px; border-radius: 8px; margin: 25px 0; border-left: 4px solid #3762ae;">
      <p style="color: #e65100; font-size: 14px; margin: 0; font-weight: 600;">This process typically takes 1-2 business days.</p>
    </div>
    <hr style="border: none; border-top: 1px solid #eee; margin: 40px 0;">
    <p style="color: #999; font-size: 12px; margin: 0;">Best regards,<br><strong>The PayMi Team</strong></p>
    <div style="margin-top: 20px; text-align: center;">
      <p style="color: #ccc; font-size: 11px; margin: 0;">© 2026 PayMi. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
