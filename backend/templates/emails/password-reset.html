<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 50px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
        <span style="color: white; font-size: 24px;">🔑</span>
      </div>
      <h2 style="color: #333; margin-top: 0; font-size: 28px; font-weight: 700;">Reset Your Password</h2>
    </div>
    <p style="color: #555; font-size: 16px; line-height: 1.6;">You requested a password reset. Click the button below to reset your password:</p>
    <div style="text-align: center; margin: 35px 0;">
      <a href="{{resetUrl}}" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 40px; text-decoration: none; border-radius: 30px; display: inline-block; font-weight: 600; font-size: 16px; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); transition: transform 0.2s;">Reset Password</a>
    </div>
    <p style="color: #777; font-size: 14px;">This link will expire in 1 hour.</p>
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 25px 0; border-left: 4px solid #667eea;">
      <p style="color: #666; font-size: 14px; margin: 0;">If you didn't request this, please ignore this email.</p>
    </div>
    <hr style="border: none; border-top: 1px solid #eee; margin: 40px 0;">
    <p style="color: #999; font-size: 12px; margin: 0;">Best regards,<br><strong>The PayMi Team</strong></p>
    <div style="margin-top: 20px; text-align: center;">
      <p style="color: #ccc; font-size: 11px; margin: 0;">© 2026 PayMi. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
