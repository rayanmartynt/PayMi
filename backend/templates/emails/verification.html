<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #44b75e 0%, #3762ae 100%);">
  <div style="max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 50px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="width: 60px; height: 60px;  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
        <img src="/frontend/public/Light mode logo.png" alt="" width="60">
      </div>
      <h2 style="color: #333; margin-top: 0; font-size: 28px; font-weight: 700;">Verify Your Email</h2>
    </div>
    <p style="color: #555; font-size: 16px; line-height: 1.6;">Your verification code is:</p>
    <div style="background: linear-gradient(135deg, #44b75e 0%, #3762ae 100%); padding: 25px; text-align: center; font-size: 32px; font-weight: bold; margin: 25px 0; border-radius: 12px; letter-spacing: 4px; color: white; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);">
      {{verificationCode}}
    </div>
    <p style="color: #777; font-size: 14px;">This code will expire in 15 minutes.</p>
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 25px 0; border-left: 4px solid #3762ae;">
      <p style="color: #666; font-size: 14px; margin: 0;">If you didn't request this code, please ignore this email.</p>
    </div>
    <hr style="border: none; border-top: 1px solid #eee; margin: 40px 0;">
    <p style="color: #999; font-size: 12px; margin: 0;">Best regards,<br><strong>The PayMi Team</strong></p>
    <div style="margin-top: 20px; text-align: center;">
      <p style="color: #ccc; font-size: 11px; margin: 0;">© 2026 PayMi. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
